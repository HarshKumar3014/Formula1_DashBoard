# Render blueprint — API only. The web front end lives on Vercel (see README).
services:
  - type: web
    name: pit-wall-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: F1_DATA_DIR
        value: /data
      - key: F1_SEASON
        value: "2026"
      # Supabase Postgres (Session pooler) connection string for the prediction game.
      # Set it in the Render dashboard; without it picks live on the ephemeral disk.
      - key: DATABASE_URL
        sync: false
      # Supabase project URL — the API verifies sign-in tokens against its public keys
      - key: SUPABASE_URL
        sync: false
